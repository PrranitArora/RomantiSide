<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f2" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'"
    />
    <title>Tiny Wonder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a id="brand" aria-label="Tiny Wonder home"
        ><span class="brandmark">✳</span> tiny wonder<span class="branddot"
          >•</span
        ></a
      ><button
        class="round"
        id="settings-button"
        aria-label="Settings"
      ></button>
    </header>
    <main id="main"></main>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="logic.js"></script>
    <script src="circle.js"></script>
    <script src="app.js"></script>
  </body>
</html>
